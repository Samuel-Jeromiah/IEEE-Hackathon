<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="StormLog: offline storm-damage reports and a local multimodal assistant.">
  <title>StormLog</title>
  <link rel="icon" href="icons/stormlog.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="StormLog home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 3h14l7 7v19H6z" fill="#2563eb"/>
        <path d="M20 3v7h7" fill="none" stroke="#1c1f26" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M17.5 9 10 19h5.5l-2.2 8L21 16.5h-5.4z" fill="#ffffff"/>
      </svg>
      <span class="brand-name">StormLog</span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#/report" data-nav="/report"><span class="tab-icon" data-icon="camera"></span><span>Report</span></a>
      <a href="#/town" data-nav="/town"><span class="tab-icon" data-icon="clipboard"></span><span>Town</span></a>
      <a href="#/guide" data-nav="/guide"><span class="tab-icon" data-icon="book"></span><span>Guide</span></a>
      <a href="#/chat" data-nav="/chat"><span class="tab-icon" data-icon="chat"></span><span>Chat</span></a>
    </nav>
    <div class="topbar-status">
      <span class="pill" id="health-pill" data-state="checking" role="status">Checking…</span>
    </div>
  </header>
  <div class="stripe-band" aria-hidden="true"></div>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
